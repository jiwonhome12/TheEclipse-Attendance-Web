<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>창의공간 출석체크</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 상단 — tkinter 앱 시안(ui_screenshots/after/01_main.png)과 같은 구성 -->
  <header class="topbar kiosk-bar">
    <button class="brand" data-action="home" aria-label="처음 화면으로">
      <span class="logo-tile">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
          <path d="M9 9.5v.5M15 9.5v.5M9.5 15a3.5 3.5 0 0 0 5 0"/>
        </svg>
      </span>
      <strong class="brand-title">창의공간 얼굴 인식 출석체크 시스템</strong>
    </button>
    <div class="top-right">
      <span class="clock-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="clock" class="clock"></span>
      </span>
      <button class="nav-link" data-action="test">카메라 테스트</button>
      <button class="nav-link" data-action="lookup">출석 조회</button>
      <a class="nav-link" href="/admin">관리자</a>
    </div>
  </header>

  <main>
    <!-- 메인 화면: 출근 / 퇴근 -->
    <section id="view-idle" class="view idle">
      <div class="action-cards">
        <button class="action-card in" data-action="CHECK_IN">
          <span class="action-top">
            <span class="action-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/></svg>
            </span>
            <span class="action-tag">CHECK-IN</span>
          </span>
          <span class="action-title">출근</span>
          <span class="action-foot">
            <span>출근 시작</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"/></svg>
          </span>
        </button>
        <button class="action-card out" data-action="CHECK_OUT">
          <span class="action-top">
            <span class="action-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/></svg>
            </span>
            <span class="action-tag">CHECK-OUT</span>
          </span>
          <span class="action-title">퇴근</span>
          <span class="action-foot">
            <span>퇴근 시작</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"/></svg>
          </span>
        </button>
      </div>
      <p class="idle-hint">버튼을 누른 뒤 카메라를 바라보고, 안내에 따라 고개를 왼쪽 · 오른쪽으로 돌리면 자동으로 기록됩니다</p>
      <p id="ai-status" class="ai-status" hidden></p>
    </section>

    <!-- 출근·퇴근·출석 조회: 얼굴 확인 중 -->
    <section id="view-verify" class="view card verify" hidden>
      <p id="verify-kind" class="pill"></p>
      <div id="verify-visual" class="visual"></div>
      <div id="verify-turn" class="turn-guide" hidden></div>
      <h2 id="verify-title"></h2>
      <p id="verify-detail" class="detail"></p>
      <div class="card-foot">
        <span id="verify-remaining" class="remaining"></span>
        <button class="ghost" data-action="home">취소</button>
      </div>
    </section>

    <!-- 출근/퇴근 결과 -->
    <section id="view-result" class="view card result" hidden>
      <div id="result-visual" class="visual"></div>
      <h2 id="result-title"></h2>
      <p id="result-detail" class="detail"></p>
      <p id="result-today" class="today"></p>
      <div class="card-foot">
        <span id="result-remaining" class="remaining"></span>
        <button class="primary" data-action="home">처음으로</button>
      </div>
    </section>

    <!-- 출석 조회 결과 -->
    <section id="view-stats" class="view card stats" hidden>
      <h2 id="stats-title"></h2>
      <div class="stat-row">
        <div class="stat">
          <small>이번 주 출석 시간</small>
          <strong id="stats-time"></strong>
          <div class="bar"><span id="stats-time-bar"></span></div>
          <small id="stats-time-need" class="muted"></small>
        </div>
        <div class="stat">
          <small>이번 주 출석 일수</small>
          <strong id="stats-days"></strong>
          <div class="bar"><span id="stats-days-bar"></span></div>
          <small id="stats-days-need" class="muted"></small>
        </div>
      </div>
      <p id="stats-today" class="today"></p>
      <table class="sessions">
        <thead><tr><th>날짜</th><th>출근</th><th>퇴근</th></tr></thead>
        <tbody id="stats-sessions"></tbody>
      </table>
      <div class="card-foot">
        <span id="stats-remaining" class="remaining"></span>
        <button class="primary" data-action="home">처음으로</button>
      </div>
    </section>

    <!-- 관리자가 [학생 등록] 탭에서 카메라를 쓰는 중 -->
    <section id="view-busy" class="view card" hidden>
      <div class="visual warn">!</div>
      <h2>관리자가 학생을 등록하는 중입니다</h2>
      <p class="detail">등록이 끝나면 출근 · 퇴근을 다시 할 수 있습니다</p>
    </section>

    <!-- 카메라 테스트: 영상 + 인식 결과 -->
    <section id="view-test" class="view test" hidden>
      <div class="video-box">
        <img id="video" alt="카메라 화면">
        <p id="video-msg" class="video-msg"></p>
      </div>
      <div class="card test-panel">
        <p class="pill">카메라 테스트</p>
        <h2 id="test-title"></h2>
        <p id="test-detail" class="detail"></p>
        <p class="muted">기록은 남지 않습니다.</p>
        <div class="card-foot">
          <span id="test-remaining" class="remaining"></span>
          <button class="ghost" data-action="home">끝내기</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/turn-guide.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
